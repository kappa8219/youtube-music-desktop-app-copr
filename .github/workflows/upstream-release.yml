name: Check upstream YouTube Music Desktop App release

on:
  schedule:
    - cron: "35 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest stable release and update packaging
        id: update
        run: python3 .github/scripts/update_upstream.py | tee -a "$GITHUB_OUTPUT"
        shell: bash

      - name: Open or update release PR
        if: steps.update.outputs.updated == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ytmdesktop-upstream-release
          delete-branch: true
          commit-message: "Update YouTube Music Desktop App to ${{ steps.update.outputs.version }}"
          title: "Update YouTube Music Desktop App to ${{ steps.update.outputs.version }}"
          body: |
            Update the desktop RPMs to the latest stable YouTube Music Desktop App release.

            Upstream release: ${{ steps.update.outputs.release_url }}
            The x86_64 and ARM64 source checksums are calculated from the release assets.
            The existing COPR workflow will build the package after this PR is merged.

      - name: Notify maintainer about the PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          VERSION: ${{ steps.update.outputs.version }}
        run: gh pr comment "$PR_URL" --body "@kappa8219 YouTube Music Desktop App $VERSION update is ready for review: $PR_URL"
